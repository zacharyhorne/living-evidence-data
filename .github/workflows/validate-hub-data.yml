name: Validate Living Evidence data

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Test validator
        run: Rscript scripts/test_validate_hub_data.R

      - name: Test cohort helper
        run: Rscript scripts/test_add_cohort.R

      - name: Validate repository data
        run: Rscript scripts/validate_hub_data.R .
